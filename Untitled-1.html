<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Universo de Flores Amarillas</title>
<style>
    :root{
        --bg:#050505;
        --gold:#ffcc00;
        --text-dim:#bbb;
        --card-grad-1:#1a1000;
        --card-grad-2:#2a1800;
        --card-border:rgba(255,204,0,.35);
        --line-text:#ffeaa0;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
        margin:0; padding:0; overflow:hidden; background:var(--bg);
        font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; touch-action:none;
        padding-top:env(safe-area-inset-top,0px);
        padding-bottom:env(safe-area-inset-bottom,0px);
    }
    canvas{ display:block; position:fixed; inset:0; }
    .hud{
        position:fixed; top:calc(7% + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%);
        text-align:center; pointer-events:none; z-index:10; width:90%;
    }
    .hud h1{ font-size:clamp(1.4rem, 6.5vw, 2rem); color:var(--gold); margin:0; letter-spacing:1.5px; font-weight:300; text-shadow:0 0 20px rgba(255,204,0,.7); }
    .hud p{ font-size:clamp(.68rem, 3.2vw, .8rem); color:var(--text-dim); margin:5px 0 0; }
    .spotify-badge{
        pointer-events:auto; /* el .hud tiene pointer-events:none para no bloquear los gestos del canvas */
        display:inline-flex; align-items:center; gap:7px;
        margin-top:12px; padding:9px 16px; min-height:36px;
        background:rgba(0,0,0,.35); border:1px solid rgba(30,215,96,.45); border-radius:50px;
        color:#1ED760; text-decoration:none; font-size:clamp(.68rem, 3vw, .78rem); letter-spacing:.3px;
        transition:background .2s, border-color .2s;
    }
    .spotify-badge:hover{ background:rgba(30,215,96,.15); border-color:#1ED760; }
    .spotify-icon{ width:17px; height:17px; fill:#1ED760; flex-shrink:0; }

    #line-overlay{ display:none; position:fixed; inset:0; z-index:100; justify-content:center; align-items:center; }
    #line-overlay.visible{ display:flex; }
    .line-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
    .line-card{
        position:relative; max-width:380px; width:90%;
        background:linear-gradient(145deg,var(--card-grad-1),var(--card-grad-2));
        border:1px solid var(--card-border); border-radius:20px;
        padding:26px 20px 20px; text-align:center;
        box-shadow:0 0 40px rgba(255,180,0,.25), 0 0 80px rgba(255,180,0,.08);
        animation:lineIn .35s cubic-bezier(.34,1.56,.64,1);
        max-height:80vh; overflow-y:auto;
    }
    @keyframes lineIn{ from{ transform:scale(.6); opacity:0; } to{ transform:scale(1); opacity:1; } }
    .line-emoji{ font-size:clamp(2rem, 8vw, 2.6rem); margin-bottom:10px; display:block; }
    .line-text{ font-size:clamp(.92rem, 4vw, 1rem); color:var(--line-text); line-height:1.6; font-style:italic; margin:0 0 12px; }
    .line-ref{ font-size:clamp(.75rem, 3.2vw, .85rem); color:var(--gold); font-weight:600; letter-spacing:.5px; }
    .line-close{
        margin-top:18px; background:rgba(255,204,0,.15); border:1px solid rgba(255,204,0,.4);
        color:var(--gold); padding:11px 30px; border-radius:50px; font-size:.9rem; cursor:pointer;
        letter-spacing:1px; transition:background .2s; min-height:44px; /* tamaño mínimo táctil recomendado */
    }
    .line-close:hover{ background:rgba(255,204,0,.3); }

    #audioToggle{
        position:fixed; z-index:20; cursor:pointer;
        top:calc(14px + env(safe-area-inset-top,0px)); right:calc(14px + env(safe-area-inset-right,0px));
        width:44px; height:44px; border-radius:50%; /* 44px: tamaño mínimo táctil recomendado */
        background:rgba(255,204,0,.12); border:1px solid rgba(255,204,0,.4);
        color:var(--gold); font-size:1.15rem; line-height:1;
        display:flex; align-items:center; justify-content:center;
        transition:background .2s; -webkit-tap-highlight-color:transparent;
    }
    #audioToggle:hover{ background:rgba(255,204,0,.25); }
</style>
</head>
<body>
    <div class="hud">
        <h1>Para Jael (Era de hortensias pero pasaron cosas) 🌻</h1>
        <p>Feliz Dia de la Amistad, abajo esta la cancion con el poema que te dije que no te iba a mostrar pero al final cedi :,v</p>
        <!-- Reemplaza el href por el link de tu canción en Spotify -->
        <a class="spotify-badge" href="https://open.spotify.com/intl-es/track/02Od4D0dQmHxSpFJ0c0XYu?si=959ee5fc02da4b86" target="_blank" rel="noopener noreferrer">
            <svg class="spotify-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 4.32-1.32 9.719-.66 13.437 1.621.361.181.54.78.304 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.18-1.2-.181-1.38-.72-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
            </svg>
            <span>Escúchala en Spotify</span>
        </a>
    </div>

    <div id="line-overlay">
        <div class="line-backdrop" onclick="closeLine()"></div>
        <div class="line-card">
            <span class="line-emoji" id="lEmoji">🌻</span>
            <p class="line-text" id="lText"></p>
            <div class="line-ref" id="lRef"></div>
            <br>
            <button class="line-close" onclick="closeLine()">Cerrar ✦</button>
        </div>
    </div>

    <canvas id="gc"></canvas>

    <!--
      Reemplaza "tu-cancion.mp3" por el nombre de tu archivo de audio y
      colócalo en la misma carpeta que este .html (o pon aquí una URL).
      El autoplay con sonido está bloqueado por los navegadores hasta que
      el usuario interactúa con la página, así que el script de abajo
      intenta reproducirla al cargar y, si falla, la arranca en el primer
      toque/clic.
    -->
    <audio id="bgAudio" src="aspasia.mp3" loop preload="auto"></audio>
    <button id="audioToggle" aria-label="Silenciar música">🔊</button>

    <script>
    'use strict';
    // ─── Versos de Altazor, Canto II (Vicente Huidobro) ─────────────────────
    const LINES = [
        { text: "Mujer el mundo está amueblado por tus ojos", emoji: "🌻" },
        { text: "Se hace más alto el cielo en tu presencia", emoji: "🌼" },
        { text: "Solo como la pluma que se cae de un pájaro en la noche", emoji: "✨" },
        { text: "¿Irías a ser ciega que Dios te dio esas manos?", emoji: "🌻" },
        { text: "Te habla por mí el color de los paisajes sin viento", emoji: "🌺" },
        { text: "Pues todo es artificio cuando tú te presentas", emoji: "🌿" },
        { text: "La aventura del planeta que estalla en pétalos de sueño", emoji: "⭐" },
        { text: "La fabulosa seguridad de tu mirada con sus constelaciones íntimas", emoji: "🌻" },
        { text: "¿Qué sería la vida si no hubieras nacido?", emoji: "💫" },
        { text: "¿Irías a ser muda que Dios te dio esos ojos?", emoji: "🌼" },
        { text: "Sólo viven tus ojos en el mundo", emoji: "🌻" },
        { text: "Porque eres la profundidad de toda cosa", emoji: "✨" }
    ];
    const POEM_REF = "Vicente Huidobro — Altazor, Canto II";

    const overlay = document.getElementById('line-overlay');
    const lText   = document.getElementById('lText');
    const lRef    = document.getElementById('lRef');
    const lEmoji  = document.getElementById('lEmoji');
    let lineOpen = false, lastLineIdx = -1;

    function showLine() {
        let idx;
        do { idx = Math.floor(Math.random() * LINES.length); } while (idx === lastLineIdx);
        lastLineIdx = idx;
        const v = LINES[idx];
        lText.textContent  = v.text ? `"${v.text}"` : "(pega aquí tu verso en el array LINES)";
        lRef.textContent   = POEM_REF;
        lEmoji.textContent = v.emoji;
        overlay.classList.add('visible');
        lineOpen = true;
    }
    function closeLine() {
        overlay.classList.remove('visible');
        lineOpen = false;
    }

    // ─── Canvas + DPI (nítido en móviles, con tope para no matar el rendimiento) ──
    // Pensado principalmente para celular: dedo grueso = pointer coarse.
    // En esos dispositivos se limita un poco más el DPR (menos píxeles que
    // dibujar = más batería/fluidez) sin que se note al tacto.
    const IS_MOBILE = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

    const canvas = document.getElementById('gc');
    const ctx    = canvas.getContext('2d', { alpha: false });
    const DPR    = Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.75 : 2);
    let W = 0, H = 0; // en píxeles CSS; el contexto se escala una vez con setTransform

    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width  = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, W, H);
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 150));
    resize();

    const REDUCE_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    // ─── Partículas (N adaptativo según tamaño de pantalla) ──────────────────
    const screenArea = window.innerWidth * window.innerHeight;
    const N = IS_MOBILE
        ? (screenArea > 350000 ? 650 : 450)              // techos más bajos: prioriza fluidez táctil
        : (screenArea > 500000 ? 900 : (screenArea > 250000 ? 650 : 450));
    const ARMS = 5;
    const MSGS = ["Feliz dia jaell","Gracias por la comida que me das","Gracias por la amistad que me das","Gracias por alegras mis diash","Tontatontatonta me caes bien","Eres delas mejores cosas que me paso en la u","Gracias por tenerme paciencia"];
    const EMOJ = ["🌻","🌻","🌼","✨","🌻","🌼"];          // misma distribución/pesos que el original
    const UNIQUE_GLYPHS = [...new Set(EMOJ)];               // solo 3 glifos únicos que hace falta dibujar

    const TYPE_STAR = 0, TYPE_FLOWER = 1, TYPE_TEXT = 2;

    const px  = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N);
    const pix = new Float32Array(N), piy = new Float32Array(N), piz = new Float32Array(N);
    const siz = new Float32Array(N);
    const typ = new Uint8Array(N);
    const bucket   = new Uint8Array(N); // solo estrellas: bucket de color
    const variant  = new Uint8Array(N); // solo flores: índice en UNIQUE_GLYPHS
    const msgIdx   = new Uint8Array(N); // solo texto: índice en MSGS

    // screenX/Y guardados para hit-test (solo TYPE_FLOWER)
    const scx = new Float32Array(N), scy = new Float32Array(N), scr = new Float32Array(N);

    const N_BUCKETS = 12;
    const bucketColor = new Array(N_BUCKETS);
    const bucketStars = Array.from({ length: N_BUCKETS }, () => []);
    for (let b = 0; b < N_BUCKETS; b++) {
        const hue = 45 + (b / (N_BUCKETS - 1)) * 15;
        const lit = 0.7;
        const a_  = Math.min(lit, 1 - lit);
        const fn  = n => { const k = (n + hue / 30) % 12; return Math.round((lit - a_ * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)))) * 255); };
        bucketColor[b] = `rgb(${fn(0)},${fn(8)},${fn(4)})`;
    }

    const flowerTextIdx = []; // solo flores + texto, para el sort por profundidad (mucho más corto que N)

    for (let i = 0; i < N; i++) {
        const radius = Math.random() * 900;
        const arm    = (i % ARMS) * ((Math.PI * 2) / ARMS);
        const angle  = arm + radius * 0.005 + (Math.random() - 0.5) * (1100 / (radius + 10));
        px[i] = Math.cos(angle) * radius;
        py[i] = Math.sin(angle) * radius;
        pz[i] = (Math.random() - 0.5) * 100;

        if (i % 55 === 0) {
            typ[i] = TYPE_TEXT; siz[i] = 15; msgIdx[i] = i % MSGS.length;
            flowerTextIdx.push(i);
        } else if (i % 4 !== 0) {
            typ[i] = TYPE_STAR; siz[i] = Math.random() * 2 + 0.3;
            bucket[i] = Math.floor(Math.random() * N_BUCKETS);
            bucketStars[bucket[i]].push(i);
        } else {
            typ[i] = TYPE_FLOWER; siz[i] = Math.random() * 16 + 8;
            variant[i] = UNIQUE_GLYPHS.indexOf(EMOJ[Math.floor(Math.random() * EMOJ.length)]);
            flowerTextIdx.push(i);
        }
    }

    // ─── Sprites pre-renderizados ─────────────────────────────────────────────
    // Dibujar emoji con fillText en cada frame es caro (rasteriza el glifo cada
    // vez) y aquí se llamaba ~225 veces por frame con un tamaño de fuente que
    // casi nunca se repetía, así que el cache de ctx.font tampoco ayudaba.
    // Se renderiza cada glifo UNA sola vez a un canvas aparte y luego, en el
    // bucle de animación, solo se hace drawImage() escalado: mucho más barato.
    const SPRITE_SRC = 192;
    function makeGlyphSprite(glyph) {
        const c = document.createElement('canvas');
        c.width = c.height = SPRITE_SRC;
        const g = c.getContext('2d');
        g.font = `${SPRITE_SRC * 0.82}px Arial`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(glyph, SPRITE_SRC / 2, SPRITE_SRC / 2 + SPRITE_SRC * 0.03);
        return c;
    }
    const glyphSprites = UNIQUE_GLYPHS.map(makeGlyphSprite);

    const TEXT_BASE_FONT = 34;
    function makeTextSprite(text) {
        const measure = document.createElement('canvas').getContext('2d');
        measure.font = `bold ${TEXT_BASE_FONT}px Verdana`;
        const pad = 8;
        const w = Math.ceil(measure.measureText(text).width) + pad * 2;
        const h = TEXT_BASE_FONT + pad * 2;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const g = c.getContext('2d');
        g.font = `bold ${TEXT_BASE_FONT}px Verdana`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillStyle = 'rgba(0,0,0,0.7)'; g.fillText(text, w / 2 + 1, h / 2 + 1);
        g.fillStyle = '#fff';           g.fillText(text, w / 2, h / 2);
        return { canvas: c, w, h };
    }
    const textSprites = MSGS.map(makeTextSprite);

    // ─── Cámara ───────────────────────────────────────────────────────────────
    // En pantallas altas y angostas (celular en vertical) se aleja un poco
    // la cámara de partida para que la galaxia entre completa sin recortes.
    const portrait = window.innerHeight > window.innerWidth;
    let rotT = 0, rotC = 0, pitT = 1.1, pitC = 1.1, zoom = portrait ? 520 : 400;
    const FOV = 600;
    const AUTO_ROTATE_SPEED = REDUCE_MOTION ? 0.02 : 0.072; // rad/seg (antes: 0.0012/frame a 60fps)

    // ─── Hit-test (tap sobre flor) ─────────────────────────────────────────────
    function hitTest(tapX, tapY) {
        let best = -1, bestDist = Infinity;
        for (let k = 0; k < flowerTextIdx.length; k++) {
            const i = flowerTextIdx[k];
            if (typ[i] !== TYPE_FLOWER) continue;
            const d = Math.hypot(tapX - scx[i], tapY - scy[i]);
            const hitRadius = Math.max(scr[i] * 1.5, 28);
            if (d < hitRadius && d < bestDist) { best = i; bestDist = d; }
        }
        return best;
    }

    // ─── Input ──────────────────────────────────────────────────────────────
    let dragging = false, lastX = 0, lastY = 0, pinchBase = null, tapMoved = false;

    canvas.addEventListener('touchstart', e => {
        if (lineOpen) return;
        if (e.touches.length === 2) {
            dragging = false;
            pinchBase = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        } else {
            lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; tapMoved = false; dragging = true;
        }
    }, { passive: true });

    canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        if (lineOpen) return;
        if (e.touches.length === 2 && pinchBase !== null) {
            const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            zoom = Math.max(80, Math.min(1800, zoom - (d - pinchBase) * 4));
            pinchBase = d; dragging = false;
        } else if (e.touches.length === 1 && dragging) {
            const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) tapMoved = true;
            rotT -= dx * 0.006;
            pitT = Math.max(0.15, Math.min(Math.PI - 0.15, pitT - dy * 0.006));
            lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
        }
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
        dragging = false; pinchBase = null;
        if (!tapMoved && e.changedTouches.length === 1) {
            const tx = e.changedTouches[0].clientX, ty = e.changedTouches[0].clientY;
            if (hitTest(tx, ty) !== -1) showLine();
        }
    }, { passive: true });

    canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; tapMoved = false; });
    canvas.addEventListener('mousemove', e => {
        if (dragging) {
            const dx = e.clientX - lastX, dy = e.clientY - lastY;
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) tapMoved = true;
            rotT -= dx * 0.006;
            pitT = Math.max(0.15, Math.min(Math.PI - 0.15, pitT - dy * 0.006));
            lastX = e.clientX; lastY = e.clientY;
            canvas.style.cursor = 'grabbing';
            return;
        }
        canvas.style.cursor = hitTest(e.clientX, e.clientY) !== -1 ? 'pointer' : 'grab';
    });
    canvas.addEventListener('mouseup', e => {
        dragging = false;
        if (!tapMoved && hitTest(e.clientX, e.clientY) !== -1) showLine();
    });
    canvas.addEventListener('mouseleave', () => { dragging = false; });
    canvas.addEventListener('wheel', e => { zoom = Math.max(80, Math.min(1800, zoom + e.deltaY)); }, { passive: true });

    // ─── Sort (solo flores + texto; las estrellas no lo necesitan) ────────────
    const sortIdx = flowerTextIdx.slice();
    function sortByDepth(a, b) { return piz[b] - piz[a]; }

    // ─── Render loop (independiente del framerate, se pausa en segundo plano) ─
    let rafId = null, lastTime = performance.now();

    function frame(now) {
        rafId = requestAnimationFrame(frame);
        const dt = Math.min((now - lastTime) / 1000, 0.05); // clamp: evita saltos al volver de pausa
        lastTime = now;

        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, W, H);

        const smooth = 1 - Math.pow(1 - 0.08, dt * 60);
        rotC += (rotT - rotC) * smooth;
        pitC += (pitT - pitC) * smooth;
        if (!dragging && pinchBase === null) rotT += AUTO_ROTATE_SPEED * dt;

        const cosR = Math.cos(rotC), sinR = Math.sin(rotC);
        const cosP = Math.cos(pitC), sinP = Math.sin(pitC);

        // Anillo central
        const rd = FOV / (FOV + zoom);
        ctx.strokeStyle = 'rgba(255,220,0,0.55)'; ctx.lineWidth = 12 * rd;
        ctx.beginPath(); ctx.ellipse(W/2, H/2, Math.max(5, 110*rd), Math.max(5, 110*rd*Math.abs(cosP)), 0, 0, Math.PI*2); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3 * rd;
        ctx.beginPath(); ctx.ellipse(W/2, H/2, Math.max(5, 125*rd), Math.max(3, 125*rd*Math.abs(cosP)), 0, 0, Math.PI*2); ctx.stroke();

        // Proyectar TODAS las partículas en una sola pasada
        for (let i = 0; i < N; i++) {
            const rx  = px[i] * cosR - py[i] * sinR;
            const ry1 = px[i] * sinR + py[i] * cosR;
            pix[i] = rx;
            piy[i] = ry1 * cosP - pz[i] * sinP;
            piz[i] = ry1 * sinP + pz[i] * cosP;
        }

        // ── Estrellas: agrupadas por color, un solo fill() por bucket (antes: uno por estrella) ──
        for (let b = 0; b < N_BUCKETS; b++) {
            const list = bucketStars[b];
            if (!list.length) continue;
            ctx.beginPath();
            let any = false;
            for (let k = 0; k < list.length; k++) {
                const i = list[k];
                const denom = FOV + piz[i] + zoom;
                if (denom < 10) continue;
                const ds = FOV / denom;
                const sx = W/2 + pix[i] * ds, sy = H/2 + piy[i] * ds;
                if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
                const rad = Math.max(0.4, siz[i] * ds);
                if (rad > 30) continue;
                ctx.moveTo(sx + rad, sy);
                ctx.arc(sx, sy, rad, 0, 6.2832);
                any = true;
            }
            if (any) { ctx.fillStyle = bucketColor[b]; ctx.fill(); }
        }

        // ── Flores + texto flotante: pocas, se ordenan por profundidad y se dibujan con sprites ──
        for (let k = 0; k < sortIdx.length; k++) sortIdx[k] = flowerTextIdx[k];
        sortIdx.sort(sortByDepth);

        for (let j = 0; j < sortIdx.length; j++) {
            const i = sortIdx[j];
            const denom = FOV + piz[i] + zoom;
            if (denom < 10) { scr[i] = 0; continue; }
            const ds = FOV / denom;
            const sx = W/2 + pix[i] * ds, sy = H/2 + piy[i] * ds;
            if (sx < -60 || sx > W + 60 || sy < -60 || sy > H + 60) { scr[i] = 0; continue; }

            if (typ[i] === TYPE_FLOWER) {
                const fs = Math.max(1, Math.min(80, siz[i] * ds));
                scx[i] = sx; scy[i] = sy; scr[i] = fs * 0.5; // para hit-test
                const sprite = glyphSprites[variant[i]];
                ctx.drawImage(sprite, sx - fs/2, sy - fs/2, fs, fs);
            } else { // TYPE_TEXT
                const fs = Math.max(6, Math.min(40, siz[i] * ds));
                const sp = textSprites[msgIdx[i]];
                const scale = fs / TEXT_BASE_FONT;
                const dw = sp.w * scale, dh = sp.h * scale;
                ctx.drawImage(sp.canvas, sx - dw/2, sy - dh/2, dw, dh);
                scr[i] = 0;
            }
        }
    }

    // ─── Música de fondo ────────────────────────────────────────────────────
    const bgAudio     = document.getElementById('bgAudio');
    const audioToggle = document.getElementById('audioToggle');
    bgAudio.volume = 0.1;
    let audioWanted = true; // el usuario no la ha silenciado a propósito

    function tryPlayAudio() {
        const p = bgAudio.play();
        if (p && p.catch) {
            p.then(() => { audioToggle.textContent = '🔊'; })
             .catch(() => {
                // Bloqueado por la política de autoplay del navegador: se
                // arrancará en la primera interacción del usuario (ver abajo).
                audioToggle.textContent = '🔈';
             });
        }
    }
    function startAudioOnFirstInteraction() {
        if (audioWanted && bgAudio.paused) tryPlayAudio();
        window.removeEventListener('pointerdown', startAudioOnFirstInteraction);
        window.removeEventListener('keydown', startAudioOnFirstInteraction);
    }
    window.addEventListener('pointerdown', startAudioOnFirstInteraction);
    window.addEventListener('keydown', startAudioOnFirstInteraction);
    tryPlayAudio(); // intento inicial, funcionará si el navegador lo permite

    audioToggle.addEventListener('click', () => {
        if (bgAudio.paused) {
            audioWanted = true;
            tryPlayAudio();
        } else {
            audioWanted = false;
            bgAudio.pause();
            audioToggle.textContent = '🔇';
        }
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = null;
        } else if (!rafId) {
            lastTime = performance.now();
            rafId = requestAnimationFrame(frame);
        }
    });

    rafId = requestAnimationFrame(frame);
    </script>
</body>
